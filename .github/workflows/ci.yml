name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an older CI run when a newer commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================
  # Quality checks
  # Runs automatically on PRs and pushes to main
  # =========================================================
  quality:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required because the formatting check compares against
          # the PR base commit / previous commit.
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # fllama is expensive to compile because it builds C/C++ code.
      # Cache the native build output so unchanged fllama code does
      # not need to be compiled on every CI run.
      - name: Cache fllama native build
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/fllama
          key: ${{ runner.os }}-fllama-${{ hashFiles('pubspec.lock', 'third_party/fllama/**') }}
          restore-keys: |
            ${{ runner.os }}-fllama-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting (changed Dart files only)
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMR \
              "$base_sha" "${{ github.sha }}" \
              -- '*.dart' ':!third_party/**'
          )

          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          dart format --output=none --set-exit-if-changed "${dart_files[@]}"

      - name: Static analysis
        run: flutter analyze

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Verify 100% test coverage gate
        run: ./tool/check_coverage.sh
